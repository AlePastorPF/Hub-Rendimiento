<title>HUB Rendimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: barra lateral negra fija (identidad SIC: negro, blanco, celeste) + barra de filtros global pegajosa + vista de trabajo en grilla */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface-2:#f5f8fa; --cell:#f1f4f6;
  --ink:#0d1114; --ink-2:#3d4a53; --muted:#6b7780; --line:#d5dde3; --grid:#e4e9ed;
  --side:#0b0d0f; --side-ink:#f4f7f9; --side-muted:#8d99a3; --side-line:#24292e;
  --celeste:#4fa3dc; --celeste-ink:#1f6aa3; --celeste-soft:rgba(79,163,220,.14);
  --win:#2f86c8; --loss:#3b434a; --draw:#a3adb5;
  --pos:#2f86c8; --neg:#d2493f;
  --good:#23915a; --good-bg:rgba(35,145,90,.13);
  --warn:#c98a10; --warn-bg:rgba(220,160,30,.17);
  --bad:#d2493f; --bad-bg:rgba(210,73,63,.13);
  --fw:#1f6aa3; --bk:#d08a1c;
  --e1:#1f6aa3; --e2:#3aa6a0; --e3:#8a6bc9; --e4:#d08a1c; --e5:#c9578c;
  --g1:#174f7a; --g2:#4fa3dc; --g3:#8a6bc9; --g4:#d08a1c; --g5:#c9578c;
  /* Mark Pro (licencia comercial): se usa si está instalada; si no, Figtree como sustituto geométrico */
  --display:"Mark Pro Heavy","MarkPro-Heavy","Mark Pro","MarkPro",Figtree,system-ui,sans-serif;
  --body:"Mark Pro","MarkPro","Mark Pro Book",Figtree,"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Mark Pro Medium","MarkPro-Medium","Mark Pro","MarkPro",Figtree,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0b0e11; --surface:#141a1f; --surface-2:#1a2127; --cell:#1c242b;
  --ink:#edf2f5; --ink-2:#b8c3ca; --muted:#84919a; --line:#2a333b; --grid:#222a31;
  --side:#050607; --side-ink:#f4f7f9; --side-muted:#7f8b94; --side-line:#1d2227;
  --celeste:#6bb8ec; --celeste-ink:#8ccaf3; --celeste-soft:rgba(107,184,236,.16);
  --win:#5aaee9; --loss:#8a959e; --draw:#56606a;
  --pos:#4a9fe0; --neg:#e4675d;
  --good:#3cbf7c; --good-bg:rgba(60,191,124,.16);
  --warn:#eab040; --warn-bg:rgba(234,176,64,.16);
  --bad:#ea6a5f; --bad-bg:rgba(234,106,95,.16);
  --fw:#6bb8ec; --bk:#eab040;
  --e1:#6bb8ec; --e2:#5cc8c0; --e3:#a98be0; --e4:#eab040; --e5:#e07aa8;
  --g1:#9fd0f5; --g2:#4a9fe0; --g3:#a98be0; --g4:#eab040; --g5:#e07aa8;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0e11; --surface:#141a1f; --surface-2:#1a2127; --cell:#1c242b;
  --ink:#edf2f5; --ink-2:#b8c3ca; --muted:#84919a; --line:#2a333b; --grid:#222a31;
  --side:#050607; --side-ink:#f4f7f9; --side-muted:#7f8b94; --side-line:#1d2227;
  --celeste:#6bb8ec; --celeste-ink:#8ccaf3; --celeste-soft:rgba(107,184,236,.16);
  --win:#5aaee9; --loss:#8a959e; --draw:#56606a;
  --pos:#4a9fe0; --neg:#e4675d;
  --good:#3cbf7c; --good-bg:rgba(60,191,124,.16);
  --warn:#eab040; --warn-bg:rgba(234,176,64,.16);
  --bad:#ea6a5f; --bad-bg:rgba(234,106,95,.16);
  --fw:#6bb8ec; --bk:#eab040;
  --e1:#6bb8ec; --e2:#5cc8c0; --e3:#a98be0; --e4:#eab040; --e5:#e07aa8;
  --g1:#9fd0f5; --g2:#4a9fe0; --g3:#a98be0; --g4:#eab040; --g5:#e07aa8;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:0}
h1{font-size:clamp(26px,3.6vw,36px);font-weight:900;line-height:1.05;text-transform:uppercase}
h2{font-size:18px;font-weight:800;text-transform:uppercase;line-height:1.15}
h3{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--celeste);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--side-line)}
.stripe{display:flex;height:8px}.stripe i{flex:1}.stripe i:nth-child(1){background:#0b0d0f}.stripe i:nth-child(2){background:#fff}.stripe i:nth-child(3){background:#6bb8ec}.stripe i:nth-child(4){background:#fff}.stripe i:nth-child(5){background:#0b0d0f}
.brand{padding:20px 20px 18px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--side-line)}
.brand b{font:900 20px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.brand b span{color:#6bb8ec}
.brand small{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted)}
nav.nav{display:flex;flex-direction:column;padding:12px 10px;gap:2px;flex:1;overflow:auto}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;font:600 15px var(--body);color:#c9d2d8;position:relative}
.nav button:hover{background:#15191d;color:#fff}
.nav button[aria-current="page"]{background:#161b20;color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:#6bb8ec}
.nav button:focus-visible{outline:2px solid #6bb8ec}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .ct{margin-left:auto;font:500 11px var(--mono);background:#d2493f;color:#fff;border-radius:9px;padding:1px 7px}
.side-foot{padding:14px 16px 18px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:8px}
.side-foot .src{font:500 11px/1.4 var(--mono);color:var(--side-muted)}
.side-foot .src b{color:#6bb8ec;font-weight:500}
.btn-side{all:unset;cursor:pointer;text-align:center;padding:9px 12px;border:1px solid #39424a;border-radius:6px;font:600 14px var(--body);color:#fff}
.btn-side:hover{border-color:#6bb8ec}

.main{min-width:0;display:flex;flex-direction:column}
.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-inline:24px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:100%}
.vhead>.ctrls{min-width:0;max-width:100%}
.fld label{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 28px 7px 10px;font-size:14px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer;max-width:100%}
select.on{border-color:var(--celeste);background-color:var(--celeste-soft);font-weight:600}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--celeste)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 11px;cursor:pointer;font:500 13px var(--body);color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.view{padding-block:22px 64px;padding-inline:24px;display:flex;flex-direction:column;gap:22px;max-width:1400px;width:100%}
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px}
.vhead .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--celeste-ink)}
.lede{color:var(--ink-2);max-width:72ch}
.scope{font:500 12px var(--mono);color:var(--muted)}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);border:1px solid color-mix(in oklab,var(--warn) 40%,transparent);border-radius:6px;padding:8px 12px;font-size:13.5px;color:var(--ink)}
.demo b{font-weight:700}
.note{font-size:13px;color:var(--muted)}
.note.inl{display:flex;gap:8px;align-items:flex-start}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .l{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .d{font:500 12px var(--mono);color:var(--muted)}
.up{color:var(--pos)}.dn{color:var(--neg)}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.span2{grid-column:span 2}
@media (max-width:1100px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}.span2{grid-column:auto}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.panel .ph .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.panel .sub{font-size:13px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--body);fill:var(--ink-2)}
.chart .tk{font:11px var(--mono);fill:var(--muted)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .lab{font-size:12.5px;fill:var(--ink)}
.chart .vl{font:500 11.5px var(--mono);fill:var(--ink-2)}
.chart [data-tip]{cursor:default}
.chart [data-click]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:0;border-top:2px solid;border-radius:0;width:16px;vertical-align:3px}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13.5px}
table.t th,table.t td{padding:7px 9px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
table.t thead th{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);vertical-align:bottom;background:var(--surface);position:sticky;top:0}
table.t th.l,table.t td.l{text-align:left}
table.t th button{all:unset;cursor:pointer}
table.t th button:hover,table.t th button.on{color:var(--ink)}
table.t th button.on::after{content:" ▾"}
table.t tbody tr:hover{background:var(--surface-2)}
table.t td.nm{font-weight:600}
table.t td.nm button{all:unset;cursor:pointer;color:var(--ink)}
table.t td.nm button:hover{color:var(--celeste-ink);text-decoration:underline}
table.t tr.sel td{background:var(--celeste-soft)}
table.t td.mono{font-family:var(--mono);font-size:12.5px}
table.heat{border-collapse:separate;border-spacing:2px;width:100%;font-variant-numeric:tabular-nums}
table.heat th{font:500 10.5px/1.25 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:4px;text-align:center;vertical-align:bottom}
table.heat th.rl{text-align:left}
table.heat td{text-align:center;padding:9px 4px;border-radius:3px;font:500 13px var(--mono)}
table.heat td.rl{text-align:left;background:none;font:600 14px var(--body);padding-right:10px;white-space:nowrap}
table.heat tr[data-click]{cursor:pointer}
table.heat tr[data-click]:hover td.rl{color:var(--celeste-ink)}
table.heat tr.sel td.rl{color:var(--celeste-ink)}

.pill{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--mono);padding:4px 8px;border-radius:10px;white-space:nowrap}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.y{background:var(--warn-bg);color:var(--warn)}
.pill.r{background:var(--bad-bg);color:var(--bad)}
.pill.n{background:var(--cell);color:var(--ink-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.n::before{display:none}
.res{display:inline-block;width:20px;text-align:center;font:700 11px/18px var(--mono);border-radius:3px;color:#fff}
.res.G{background:var(--win)}.res.P{background:var(--loss)}.res.E{background:var(--draw)}
.sc{display:inline-block;min-width:24px;text-align:center;font:600 12px/20px var(--mono);border-radius:3px}

.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.tl>div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tl b{font:800 34px/1 var(--display)}
.tl .g b{color:var(--good)}.tl .y b{color:var(--warn)}.tl .r b{color:var(--bad)}
.tl span{font-size:13px;color:var(--ink-2)}

.stat-card{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat-card div{display:flex;flex-direction:column;gap:2px}
.stat-card .l{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat-card .v{font:700 20px/1.15 var(--display);font-variant-numeric:tabular-nums}
.verdict{border-left:4px solid var(--celeste);background:var(--surface-2);padding:10px 14px;border-radius:4px;font-size:14.5px;max-width:90ch}
.verdict b{font-weight:700}
.ctrls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}

.bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.bullets li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;max-width:95ch}
.bullets li .k{margin-top:2px}
.prog{height:6px;background:var(--cell);border-radius:3px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--celeste)}
.pcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.pcard{grid-template-columns:1fr}}
.pctrow{display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;font-size:13.5px}
.pctbar{height:10px;background:var(--cell);border-radius:5px;position:relative}
.pctbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.pctbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px dashed var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;background:var(--surface)}

#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font:12.5px/1.4 var(--body);padding:7px 10px;border-radius:6px;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:opacity .08s}
#tip b{font-weight:700}
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,10,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:760px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal code{font:12px/1.5 var(--mono);background:var(--cell);padding:8px 10px;border-radius:5px;display:block;overflow-x:auto;white-space:pre}
.msg{font-size:13.5px;padding:8px 12px;border-radius:6px}
.msg.ok{background:var(--good-bg);color:var(--good)}.msg.err{background:var(--bad-bg);color:var(--bad)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:relative;height:auto;flex-direction:column;min-width:0}
  .brand{flex-direction:row;align-items:baseline;justify-content:space-between;padding:12px 16px}
  .brand b{font-size:24px}
  nav.nav{flex-direction:row;overflow-x:auto;padding:6px 10px 10px}
  .nav button{white-space:nowrap;padding:8px 10px}
  .nav button[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:3px}
  .side-foot{flex-direction:row;align-items:center;justify-content:space-between;padding:8px 16px}
  .fbar{padding-inline:16px;position:relative}
  .view{padding-inline:16px}
}

/* filtros multiselección, logos, ERU */
.ms{cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 28px 7px 10px;font-size:14px;text-align:left;min-width:96px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.ms.on{border-color:var(--celeste);background-color:var(--celeste-soft);font-weight:600}
.ms:hover{border-color:var(--celeste)}
#msPop{position:fixed;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:10px;display:flex;flex-direction:column;gap:8px;max-height:min(70vh,520px)}
#msPop .msh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#msPop input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
#msPop .msa{display:flex;gap:6px;flex-wrap:wrap}
#msPop .msa .btn{padding:5px 9px;font-size:12.5px}
#msPop .msl{overflow:auto;display:flex;flex-direction:column;gap:1px;min-height:60px}
.msi{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:5px;cursor:pointer;font-size:14px}
.msi:hover{background:var(--surface-2)}
.msi small{color:var(--muted)}
.msi input{accent-color:var(--celeste-ink);width:16px;height:16px;flex:none}
.lg{display:inline-block;flex:none;object-fit:contain;vertical-align:middle;background:#fff;border-radius:4px;padding:1px;box-shadow:0 0 0 1px var(--line)}
.lg.ball{background:transparent;box-shadow:none;padding:0}
.lg.ball svg{width:100%;height:100%;display:block}
.actc{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.brand{flex-direction:row!important;align-items:center;gap:12px!important}
.brand img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;flex:none}
.brand .bt{display:flex;flex-direction:column;gap:4px}
.ecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ecard{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2);min-width:0}
.ecard.temp{border-top:3px solid var(--ink)}.ecard.sel{border-top:3px solid var(--celeste)}
.ecard header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ecard h3{font-size:17px;text-transform:none;letter-spacing:0}
.lnk{all:unset;cursor:pointer}.lnk:hover{color:var(--celeste-ink);text-decoration:underline}
.eval{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eval div{display:flex;flex-direction:column}

const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5);
const fDate=iso=>{if(!iso)return'–';const [y,m,d]=String(iso).split('-');return `${d}/${m}/${y.slice(2)}`};
const mmss=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ================= estadística ================= */
function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const ci of c)s+=ci/++y;return -t+Math.log(2.5066282746310005*s/x)}
function betacf(a,b,x){const MAXIT=200,EPS=3e-14,FP=1e-300;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<FP)d=FP;d=1/d;let h=d;for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break}return h}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
const tP2=(t,df)=>ibeta(df/(df+t*t),df/2,.5);
function tInv(p2,df){let lo=0,hi=200;for(let i=0;i<80;i++){const m=(lo+hi)/2;if(tP2(m,df)>p2)lo=m;else hi=m}return(lo+hi)/2}
const fP=(F,d1,d2)=>(!isFinite(F)||F<=0)?1:ibeta(d2/(d2+d1*F),d2/2,d1/2);
function gammp(a,x){if(x<=0)return 0;if(x<a+1){let ap=a,s=1/a,del=s;for(let n=0;n<300;n++){ap++;del*=x/ap;s+=del;if(Math.abs(del)<Math.abs(s)*3e-14)break}return s*Math.exp(-x+a*Math.log(x)-lgamma(a))}let b=x+1-a,c=1e300,d=1/b,h=d;for(let i=1;i<300;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-14)break}return 1-Math.exp(-x+a*Math.log(x)-lgamma(a))*h}
const chiP=(x,k)=>1-gammp(k/2,x/2);
function Phi(z){const t=1/(1+.2316419*Math.abs(z)),d=.3989422804014327*Math.exp(-z*z/2);const p=d*t*(.31938153+t*(-.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));return z>0?1-p:p}
const nP2=z=>2*(1-Phi(Math.abs(z)));
function desc(a){const n=a.length,m=mean(a),s=sd(a);const t=n>1?tInv(.05,n-1):NaN;const h=t*s/Math.sqrt(n);return{n,m,s,lo:m-h,hi:m+h,cv:s/Math.abs(m)*100,med:quant(a,.5),q1:quant(a,.25),q3:quant(a,.75),min:Math.min(...a),max:Math.max(...a)}}
function welch(a,b){const n1=a.length,n2=b.length,m1=mean(a),m2=mean(b),v1=sd(a)**2,v2=sd(b)**2;const se=Math.sqrt(v1/n1+v2/n2);const t=(m1-m2)/se;const df=(v1/n1+v2/n2)**2/((v1/n1)**2/(n1-1)+(v2/n2)**2/(n2-1));return{t,df,p:tP2(t,df)}}
function hedges(a,b){const n1=a.length,n2=b.length,m1=mean(a),m2=mean(b),v1=sd(a)**2,v2=sd(b)**2;const sp=Math.sqrt(((n1-1)*v1+(n2-1)*v2)/(n1+n2-2));const J=1-3/(4*(n1+n2)-9);const g=(m1-m2)/sp*J;const se=Math.sqrt((n1+n2)/(n1*n2)+g*g/(2*(n1+n2)));return{g,lo:g-1.96*se,hi:g+1.96*se}}
function ranks(vals){const idx=vals.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]);const r=new Array(vals.length);let tie=0;for(let i=0;i<idx.length;){let j=i;while(j+1<idx.length&&idx[j+1][0]===idx[i][0])j++;const rk=(i+j)/2+1;for(let k=i;k<=j;k++)r[idx[k][1]]=rk;const t=j-i+1;if(t>1)tie+=t*t*t-t;i=j+1}return{r,tie}}
function mannW(a,b){const n1=a.length,n2=b.length,N=n1+n2;const {r,tie}=ranks([...a,...b]);const R1=sum(r.slice(0,n1));const U=R1-n1*(n1+1)/2;const mu=n1*n2/2;const sig=Math.sqrt(n1*n2/12*((N+1)-tie/(N*(N-1))));const z=(U-mu)/sig;return{U,z,p:nP2(z),r:z/Math.sqrt(N)}}
function anova(gs){const all=gs.flat(),N=all.length,k=gs.length,gm=mean(all);let ssb=0,ssw=0;for(const g of gs){const m=mean(g);ssb+=g.length*(m-gm)**2;ssw+=sum(g.map(v=>(v-m)**2))}const dfb=k-1,dfw=N-k,msw=ssw/dfw,F=(ssb/dfb)/msw;return{F,dfb,dfw,p:fP(F,dfb,dfw),eta2:ssb/(ssb+ssw),omega2:Math.max(0,(ssb-dfb*msw)/(ssb+ssw+msw))}}
function kruskal(gs){const all=gs.flat(),N=all.length;const {r,tie}=ranks(all);let off=0,s=0;for(const g of gs){const R=sum(r.slice(off,off+g.length));s+=R*R/g.length;off+=g.length}let H=12/(N*(N+1))*s-3*(N+1);H/=1-tie/(N*N*N-N);return{H,df:gs.length-1,p:chiP(H,gs.length-1),eps2:H/(N-1)}}
function holm(ps){const o=ps.map((p,i)=>[p,i]).sort((a,b)=>a[0]-b[0]);const m=ps.length,out=new Array(m);let mx=0;o.forEach(([p,i],k)=>{mx=Math.max(mx,Math.min(1,(m-k)*p));out[i]=mx});return out}
function pearson(x,y){const n=x.length,mx=mean(x),my=mean(y);let sxy=0,sx=0,sy=0;for(let i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sx+=(x[i]-mx)**2;sy+=(y[i]-my)**2}const r=sxy/Math.sqrt(sx*sy);const t=r*Math.sqrt((n-2)/(1-r*r));const z=Math.atanh(r),se=1/Math.sqrt(n-3);return{r,n,p:tP2(t,n-2),lo:Math.tanh(z-1.96*se),hi:Math.tanh(z+1.96*se),b:sxy/sx,a:my-sxy/sx*mx}}
function jacobi(A){const n=A.length;const a=A.map(r=>[...r]);const v=a.map((r,i)=>r.map((_,j)=>i===j?1:0));for(let sw=0;sw<100;sw++){let off=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)off+=a[i][j]**2;if(off<1e-14)break;for(let p=0;p<n;p++)for(let q=p+1;q<n;q++){if(Math.abs(a[p][q])<1e-15)continue;const th=(a[q][q]-a[p][p])/(2*a[p][q]);const t=Math.sign(th||1)/(Math.abs(th)+Math.sqrt(th*th+1));const c=1/Math.sqrt(t*t+1),s=t*c;for(let k=0;k<n;k++){const akp=a[k][p],akq=a[k][q];a[k][p]=c*akp-s*akq;a[k][q]=s*akp+c*akq}for(let k=0;k<n;k++){const apk=a[p][k],aqk=a[q][k];a[p][k]=c*apk-s*aqk;a[q][k]=s*apk+c*aqk}for(let k=0;k<n;k++){const vkp=v[k][p],vkq=v[k][q];v[k][p]=c*vkp-s*vkq;v[k][q]=s*vkp+c*vkq}}}const ev=a.map((r,i)=>r[i]);const ord=ev.map((e,i)=>i).sort((i,j)=>ev[j]-ev[i]);return{values:ord.map(i=>ev[i]),vectors:ord.map(i=>v.map(r=>r[i]))}}
const magG=g=>{const a=Math.abs(g);return a<.2?'trivial':a<.6?'pequeño':a<1.2?'moderado':a<2?'grande':'muy grande'};
const magR=r=>{const a=Math.abs(r);return a<.1?'trivial':a<.3?'pequeña':a<.5?'moderada':a<.7?'grande':a<.9?'muy grande':'casi perfecta'};
const fp=p=>p<.001?'< 0,001':fmt(p,3);
const stars=p=>p<.001?'***':p<.01?'**':p<.05?'*':'';

/* ================= lectores de planillas (navegador y node) ================= */
const POS={PL:{n:'Pilar',g:'F'},HK:{n:'Hooker',g:'F'},SL:{n:'2ª línea',g:'F'},BR:{n:'3ª línea',g:'F'},SH:{n:'Medio scrum',g:'B'},FH:{n:'Apertura',g:'B'},CE:{n:'Centro',g:'B'},WG:{n:'Wing',g:'B'},FB:{n:'Fullback',g:'B'}};
const POSK=Object.keys(POS);
const normTxt=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const hKey=s=>normTxt(s).replace(/\s+/g,'_');
const nameKey=s=>normTxt(s).replace(/[^a-z ]/g,' ').split(' ').filter(Boolean).sort().join(' ');
const cleanName=s=>String(s??'').replace(/\s+/g,' ').trim();
const POSMAP={pilar:'PL',pl:'PL',hooker:'HK',hk:'HK',segundalinea:'SL','2dalinea':'SL','2alinea':'SL',sl:'SL',lock:'SL',terceralinea:'BR','3ralinea':'BR','3alinea':'BR',br:'BR',ala:'BR',octavo:'BR',medioscrum:'SH',sh:'SH',apertura:'FH',fh:'FH',centro:'CE',ce:'CE',wing:'WG',wg:'WG',fullback:'FB',fb:'FB',ob:'WG'};
const mapPos=v=>POSMAP[normTxt(v).replace(/[^a-z0-9]/g,'')]||null;
const toNum=v=>{if(v==null||v==='')return NaN;if(typeof v==='number')return v;const s=String(v).trim();return +(s.includes(',')&&!s.includes('.')?s.replace(',','.'):s.replace(/,/g,''))};
const sum0=a=>a.reduce((x,y)=>x+y,0);
const r1=v=>isFinite(v)?Math.round(v*10)/10:null, r2=v=>isFinite(v)?Math.round(v*100)/100:null;
function dIso(v){if(v==null||v==='')return'';if(v instanceof Date){if(isNaN(v))return'';return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`}
 if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
 const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return''}
function tableOf(ws,XL){const a=XL.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});let i=0;while(i<a.length&&!(a[i]||[]).some(x=>x!=null&&String(x).trim()))i++;const hdr=(a[i]||[]).map(hKey);return{hdr,rows:a.slice(i+1).filter(r=>r&&r.some(x=>x!=null&&String(x).trim()!==''))}}
function detectKind(t){const h=new Set(t.hdr);const has=k=>h.has(k),some=re=>t.hdr.some(x=>re.test(x));
 if(has('jugador')&&has('periodo')&&has('actividad')&&has('distancia'))return'carga';
 if(has('secuencia')&&has('total_duration'))return'bip';
 if(has('masa_adiposa')||some(/sumatoria_pliegues/))return'nutri';
 if(some(/dolorido/)&&some(/recuperado/))return'well';
 if(has('region')&&some(/^dias/))return'les';
 if(has('resultado')&&(has('fecha')||has('partido')||has('rival')))return'res';
 return null}
const col=(t,...keys)=>{for(const k of keys){const i=typeof k==='string'?t.hdr.indexOf(k):t.hdr.findIndex(x=>k.test(x));if(i>=0)return i}return -1};
function parseAct(act){const name=String(act).replace(/^\s*sic\s+vs\.?\s*/i,'').trim();const team=/\(int\)/i.test(name)?'INT':'PRI';
 const phase=/final/i.test(name)?'Final':/semi/i.test(name)?'Semi':/\bpo\b|play.?off/i.test(name)?'PO':/\s2\s*$/.test(name)?'R2':'R1';
 const rival=name.replace(/\(int\)|\(semi\)|\bsemi\b|\bfinal\b|\bpo\b|\(amistoso\)/gi,'').replace(/\s2\s*$/,'').replace(/\s+/g,' ').trim();return{team,phase,rival}}

function parseCarga(t){
 const c={jug:col(t,'jugador'),per:col(t,'periodo'),act:col(t,'actividad'),fecha:col(t,'fecha'),pue:col(t,'puesto'),dmin:col(t,'duracion_(min)'),ds:col(t,'duracion_(s)'),dist:col(t,'distancia'),mpm:col(t,'mts/min'),acc:col(t,'max_acel'),acdc:col(t,'#_acdc'),dexp:col(t,'dist_exp'),eexp:col(t,'esf_expl'),hsr:col(t,/^hsr_\(/),rhie:col(t,'rhie_total_bouts'),big:col(t,'#_big'),bl:col(t,'big_(largo)'),bm:col(t,'big_(medio)'),bc:col(t,'big_(corto)'),cont:col(t,'contactos'),vmax:col(t,'max_vel'),etq:col(t,'etiqueta_de_actividad'),temp:col(t,'temporada')};
 const miss=['jug','per','act','fecha','dist'].filter(k=>c[k]<0);if(miss.length)throw new Error('La planilla de carga no tiene las columnas: '+miss.join(', '));
 const players={},ppos={},matches={},gps=[],tr={};const g=(r,k)=>c[k]<0?NaN:toNum(r[c[k]]);
 const qa={filas:t.rows.length,duplicadas:0,ficticias:0,sinFechaONombre:0,partidoSinDatos:0,periodosOtros:0,sesionRepetida:0,bigSinEventos:0};const seen=new Set();
 for(const r of t.rows){const sig=r.map(x=>x instanceof Date?x.getTime():x).join('\u0001');if(seen.has(sig)){qa.duplicadas++;continue}seen.add(sig);
  const name=cleanName(r[c.jug]);const date=dIso(r[c.fecha]);if(!name||!date){qa.sinFechaONombre++;continue}
  const dist=g(r,'dist'),mpm=g(r,'mpm');if(dist===1500&&mpm===12.5){qa.ficticias++;continue}
  const pos=c.pue>=0?mapPos(r[c.pue]):null;const key=nameKey(name);if(!players[key])players[key]={id:name};const pid=players[key].id;
  if(pos){const pp=ppos[pid]||(ppos[pid]={});pp[pos]=pp[pos]||{n:0,last:''};pp[pos].n++;if(date>pp[pos].last)pp[pos].last=date}
  const act=cleanName(r[c.act]);const per=normTxt(r[c.per]);const etq=c.etq>=0?normTxt(r[c.etq]):'';

 const by=groupBy(fAntro(o),a=>a.pid);const obj=nutObj();const out=[];
 for(const [pid,as0] of by){const as=as0.sort((a,b)=>a.date<b.date?-1:1);const last=as[as.length-1],prev=as.length>1?as[as.length-2]:null;const pos=posOf(pid)||last.pos;const tgt=obj[pos];
  const d=k=>prev&&ok(last[k])&&ok(prev[k])?last[k]-prev[k]:null;const dS=d('sum'),dM=d('musc'),dA=d('adip'),dW=d('peso');
  const lvl=(ok(tgt)&&last.sum>tgt+15)||(ok(dS)&&dS>8)||(ok(dM)&&dM<-1.5)?'r':(ok(tgt)&&last.sum>tgt)||(ok(dS)&&dS>3)||(ok(dM)&&dM<-.5)?'y':'g';
  const acts=[];if(ok(tgt)&&last.sum>tgt)acts.push(`Σ pliegues ${fmt(last.sum-tgt,0)} mm sobre el objetivo del puesto: plan de reducción de masa adiposa`);if(ok(dS)&&dS>3)acts.push(`subió ${fmt(dS,1)} mm desde la medición anterior`);if(ok(dM)&&dM<-.5)acts.push(`perdió ${fmt(-dM,1)} kg de masa muscular: revisar ingesta proteica y energía`);if(ok(last.imo)&&last.imo<4.6)acts.push('índice músculo/óseo bajo');
  out.push({pid,pos,last,prev,tgt,dS,dM,dA,dW,lvl,acts,n:as.length,age:dayDiff(last.date,REF)})}
 return out.sort((a,b)=>'ryg'.indexOf(a.lvl)-'ryg'.indexOf(b.lvl)||((b.last.sum-(b.tgt||0))-(a.last.sum-(a.tgt||0))));
}

function pctRank(arr,v){return arr.filter(x=>x<v).length/arr.length*100+arr.filter(x=>x===v).length/arr.length*50}
function playerCard(pid,lines,ws,nt,acw){
 const pos=posOf(pid);const mode='match';const mine=gRows({},mode);const peers=gRows({player:'all',pos,group:'all'},mode);const pm=[...groupBy(peers,r=>r.pid)].map(([id,a])=>({id,v:Object.fromEntries(GM.map(m=>[m.k,mOf(a,m.k,mode)]))}));const me=pm.find(x=>x.id===pid);
 const w=ws.list.find(s=>s.pid===pid),n=nt.find(s=>s.pid===pid),a=acw.find(x=>x.pid===pid);

 if(!me){h+=`<p class="note">Sin partidos GPS para este jugador con los filtros elegidos.</p></section>`;lines.push(`Ficha ${pid}: sin partidos con los filtros.`);return h}
 const pr=GM.map(m=>{const arr=pm.map(x=>x.v[m.k]).filter(ok);if(!ok(me.v[m.k])||!arr.length)return null;let pc=pctRank(arr,me.v[m.k]);if(m.inv)pc=100-pc;return{m,pc,v:me.v[m.k]}}).filter(Boolean);

 const last=[...mine].sort((a,b)=>MI[a.mid].date<MI[b.mid].date?-1:1).slice(-8).reverse();
 h+=`<div style="display:flex;flex-direction:column;gap:9px;min-width:0"><h3>Últimos partidos</h3><div class="scroll"><table class="t"><thead><tr><th class="l">Fecha</th><th class="l">Rival</th><th>Min</th><th>Dist.</th><th>m/min</th><th>HSR</th><th>Esf. expl.</th><th>Cont.</th></tr></thead><tbody>${last.map(r=>{const m=MI[r.mid];return `<tr><td class="l mono">${fDate(m.date)}</td><td class="l"><span class="actc">${logoImg(m.rival,16)}<span>${esc(m.rival)}${m.team==='INT'?' (I)':''}</span></span>${resOf(m)?` <span class="res ${resOf(m)}">${resOf(m)}</span>`:''}</td><td>${fmt(r.min,0)}</td><td>${fmt(r.dist,0)}</td><td>${fmt(val(r,'mpm'),1)}</td><td>${fmt(r.hsr,0)}</td><td>${fmt(r.eexp,0)}</td><td>${fmt(r.cont,0)}</td></tr>`}).join('')}</tbody></table></div>`+
  `${bs?`<h3>En pelota en juego</h3><p>${fmt(bs.mpm,1)} m/min · peor escenario ${fmt(bs.peak,1)} m/min · ${fmt(bs.contpm,2)} contactos/min · ${fmt(bs.min,0)} min registrados.</p>`:''}${w?`<h3>Último wellness</h3><p>${fDate(w.last.date)} · total ${fmt(w.last.tot,0)}/25 (z ${sgn(w.z,1)})${w.last.zones.length?' · dolor en '+esc(w.last.zones.join(', ').toLowerCase()):''}${w.last.com?' · “'+esc(w.last.com)+'”':''}</p>`:''}${n?`<h3>Composición corporal</h3><p>${fDate(n.last.date)} · Σ ${fmt(n.last.sum,1)} mm (objetivo ${n.tgt??'–'}) · músculo ${fmt(n.last.musc,1)} kg · adiposa ${fmt(n.last.adip,1)} kg</p>`:''}</div></div>`;
 const strong=pr.filter(x=>x.pc>=75).map(x=>x.m.s),weak=pr.filter(x=>x.pc<=25).map(x=>x.m.s);

 lines.push('Mayor producción física: '+top.slice(0,3).map(x=>`${x.pid} (${sgn(x.z,2)})`).join(', ')+'.');if(al.length)lines.push('A vigilar: '+al.slice(0,8).map(([pid,a])=>`${pid} — ${a.map(x=>x[0]).join('; ')}`).join(' | '));

   const fd=readWorkbook(wb,XLSX);if(!fd.length)throw new Error(`No reconozco el formato de “${f.name}”. Revisá que tenga los encabezados originales en la primera fila.`);found.push(...fd)}
  const backup=JSON.stringify(DB);let msgs;try{msgs=applyFound(DB,found);indexDB()}catch(err){DB=JSON.parse(backup);indexDB();throw err}
  let saved=true;try{await idb.set('db',DB)}catch(e){saved=false}SRC='Planillas cargadas en este navegador';
  if(found.some(f=>f.kind==='carga')){const ss=seasons();F.season=ss.length?[String(ss[ss.length-1])]:[];persist()}ERUC=null;
  render();openModal(['ok','Listo.\n'+msgs.join('\n')+(saved?'':'\nNo se pudo guardar en el navegador: al recargar la página vas a ver los datos publicados.')])}
 catch(err){console.error(err);openModal(['err',err.message])}
}

/* ================= Índice ERU ================= */
const ERU_M=[['min','Duración','min',1],['dexp','Dist Exp','m',0],['rhie','RHIE','bouts',0],['big','BiG','s',2],['cont','Contactos','n',0]];
const ERU_COL=['var(--e1)','var(--e2)','var(--e3)','var(--e4)','var(--e5)'];
const W0={G1:[10,20,20,25,25],G2:[10,20,15,25,30],G3:[20,20,25,15,10],G4:[20,25,25,15,15],G5:[20,35,25,10,10]};
let ERUW=JSON.parse(JSON.stringify(W0));
const ERU_CAP=3,BIG_FLOOR=.5;
let ERUC=null;
const eruValid=(k,v)=>k==='big'?(ok(v)&&v>0):(ok(v)&&v>=0);
function eruRefs(recs,keyf){const refs={};for(const r of recs){const key=keyf(r);const o=refs[key]||(refs[key]={n:0,sum:{},cnt:{}});o.n++;for(const [k] of ERU_M)if(eruValid(k,r[k])){o.sum[k]=(o.sum[k]||0)+r[k];o.cnt[k]=(o.cnt[k]||0)+1}}for(const o of Object.values(refs)){o.ref={};for(const [k] of ERU_M)o.ref[k]=o.cnt[k]?o.sum[k]/o.cnt[k]:null}return refs}
function eruScore(r,ref,w){let sw=0;const norm={};ERU_M.forEach(([k],i)=>{const v=r[k],R=ref[k];if(!eruValid(k,v)||!(R>0)||!(w[i]>0)){norm[k]=eruValid(k,v)&&R>0?(k==='big'?Math.min(ERU_CAP,R/Math.max(v,BIG_FLOOR)):Math.min(ERU_CAP,v/R)):null;return}norm[k]=k==='big'?Math.min(ERU_CAP,R/Math.max(v,BIG_FLOOR)):Math.min(ERU_CAP,v/R);sw+=w[i]});
 const contrib={};let e=0;ERU_M.forEach(([k],i)=>{if(norm[k]==null||!(w[i]>0)||!sw){contrib[k]=0;return}const c=100*w[i]/sw*norm[k];contrib[k]=c;e+=c});return{norm,contrib,eru:sw>0?e:null,wsum:sw}}
const lowerB=(a,v)=>{let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<v)lo=m+1;else hi=m}return lo},upperB=(a,v)=>{let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<=v)lo=m+1;else hi=m}return lo};
function eruCompute(){
 const recs=[];

 // método ERU
 const wrow=g=>{const ws=ERUW[g];const sw=sum(ws);return `<tr><td class="l nm">${ERUG[g]}</td>${ws.map(x=>`<td>${fmt(x,0)}</td>`).join('')}<td><b>${sw}%</b>${Math.abs(sw-100)>.01?` ${lvlPill('y','se normaliza')}`:''}</td><td class="mono">${ws.map(x=>fmt(sw?x/sw*100:0,1)).join(' · ')}</td></tr>`};
 h+=`<section class="panel"><div class="ph"><div class="t"><h2>Cálculo del Índice ERU</h2><span class="sub">Se calcula para cada registro (jugador en un partido o en una sesión de entrenamiento), por separado para partidos y entrenamientos.</span></div></div>
 <ol class="steps"><li><b>Grupo posicional</b> según el puesto registrado en esa actividad (si falta, el puesto habitual del jugador): pilares y hooker → Primera línea; 2ª y 3ª línea → Segunda / tercera línea; medio scrum; apertura y centros → Backs internos; wings y fullback → Backs externos.</li>
 <li><b>Referencia estacional estable</b>: para cada temporada, la media de cada métrica con <b>todos</b> los partidos válidos del plantel (no cambia al filtrar jugadores). Los entrenamientos se normalizan con esa misma referencia de partido. En BiG se excluyen los registros sin eventos.</li>
 <li><b>Normalización</b>: métricas directas = valor ÷ referencia; BiG = referencia ÷ valor (con un mínimo de ${BIG_FLOOR} s para evitar divisiones extremas). Cada valor normalizado se limita a ${ERU_CAP} (3 veces la referencia) para que un extremo no domine el índice. Un 0 real (p. ej. 0 contactos) puntúa 0; un dato faltante no se convierte en 0: su peso se reparte proporcionalmente entre las métricas disponibles.</li>
 <li><b>Ponderación</b>: ERU (UA) = 100 × Σ (valor normalizado × peso efectivo). Los pesos efectivos suman 1. Con todas las métricas en su referencia, el índice vale 100.</li>
 <li><b>% máximo propio</b> = ERU del registro ÷ mejor ERU del mismo jugador <b>en partido</b> dentro de la temporada/s, equipo y minutos elegidos × 100. Su mejor partido de esa selección vale 100%. Si no tiene partidos en ella, queda sin dato.</li>

 h+=`<section class="panel"><div class="ph"><div class="t"><h2>Logos de rivales</h2><span class="sub">Asociados por el nombre del rival en la actividad (“SIC vs …”). Si no hay logo identificable, se usa una pelota.</span></div></div><div class="logos">${LOGO_INFO.map(([f,k,nm])=>`<div class="lgi"><img src="logos/${f}.webp" alt="${esc(nm)}" width="40" height="40" class="lg"><span><b>${esc(k)}</b><br><small>${esc(nm)}</small></span></div>`).join('')}<div class="lgi"><span class="lg ball" style="width:40px;height:40px">${BALL_HTML}</span><span><b>Hurling</b><br><small>Sin logo entregado</small></span></div></div></section>`;

/* ================= Nutrición: composición ================= */
const COMP=[['musc','Masa muscular','var(--e1)'],['adip','Masa adiposa','var(--e4)'],['osea','Masa ósea','var(--e2)'],['resid','Masa residual','var(--e3)'],['piel','Masa de la piel','var(--e5)']];
function donut(parts,o={}){const W=240,H=240,cx=120,cy=120,R=108,r0=66;const tot=sum(parts.map(p=>p.v));if(!tot)return'';let a0=-Math.PI/2,s='';const P=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
 for(const p of parts){const a1=a0+p.v/tot*2*Math.PI;const lg=a1-a0>Math.PI?1:0;const [x0,y0]=P(a0,R),[x1,y1]=P(a1,R),[x2,y2]=P(a1,r0),[x3,y3]=P(a0,r0);s+=`<path d="M${x0.toFixed(2)},${y0.toFixed(2)}A${R},${R} 0 ${lg} 1 ${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}A${r0},${r0} 0 ${lg} 0 ${x3.toFixed(2)},${y3.toFixed(2)}Z" style="fill:${p.color};stroke:var(--surface);stroke-width:2"${ta(p.tip)}/>`;
  if(p.v/tot>.045){const [lx,ly]=P((a0+a1)/2,(R+r0)/2);s+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" dy=".35em" text-anchor="middle" style="font:700 12px var(--mono);fill:#fff;pointer-events:none">${fmt(p.v/tot*100,0)}%</text>`}a0=a1}
 s+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" style="font:800 24px var(--display);fill:var(--ink)">${esc(o.center||'')}</text><text x="${cx}" y="${cy+18}" text-anchor="middle" style="font:500 11px var(--mono);fill:var(--muted)">${esc(o.sub||'')}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" style="max-width:250px;width:100%" role="img" aria-label="${esc(o.aria||'Composición corporal')}">${s}</svg>`}
function nutComp(){
 const all=fAntro().filter(a=>COMP.every(([k])=>ok(a[k])));if(!all.length)return'';
 const dates=[...new Set(all.map(a=>a.date))].sort().reverse();if(UI.nutDate!=='last'&&!dates.includes(UI.nutDate))UI.nutDate='last';
 let recs;if(UI.nutDate==='last'){const by={};for(const a of all)if(!by[a.pid]||a.date>by[a.pid].date)by[a.pid]=a;recs=Object.values(by)}else recs=all.filter(a=>a.date===UI.nutDate);
 if(!recs.length)return'';const P1=one('player');const m=k=>mean(recs.map(a=>a[k]));const tot=sum(COMP.map(([k])=>m(k)));const peso=mean(recs.map(a=>a.peso).filter(ok));
 const parts=COMP.map(([k,l,c])=>({v:m(k),color:c,tip:`<b>${l}</b><br>${fmt(m(k),1)} kg · ${fmt(m(k)/tot*100,1)}% de la suma de componentes`}));
 const title=P1?esc(P1):`${recs.length} jugadores`;const when=UI.nutDate==='last'?(P1?fDate(recs[0].date):'última evaluación de cada uno'):fDate(UI.nutDate);
 return `<section class="panel"><div class="ph"><div class="t"><h2>Composición corporal</h2><span class="sub">${title} · ${when}. Porcentajes sobre la suma de las 5 masas del modelo antropométrico; no se suman la Σ de pliegues, el z adiposo ni el IM/O, que se derivan de las mismas medidas.${P1?'':' Valores medios del grupo filtrado: elegí un jugador para ver el suyo.'}</span></div>${selH('nutDate','Fecha de evaluación',UI.nutDate,[['last','Última de cada jugador'],...dates.map(d=>[d,fDate(d)])])}</div>
 <div class="compw"><div>${donut(parts,{center:fmt(tot,1)+' kg',sub:'suma de masas'})}</div><div class="scroll" style="min-width:0"><table class="t"><thead><tr><th class="l">Componente</th><th>kg</th><th>%</th></tr></thead><tbody>${COMP.map(([k,l,c])=>`<tr><td class="l"><i class="sw2" style="background:${c}"></i>${l}</td><td>${fmt(m(k),1)}</td><td>${fmt(m(k)/tot*100,1)}%</td></tr>`).join('')}<tr><td class="l"><b>Suma de componentes</b></td><td><b>${fmt(tot,1)}</b></td><td>100%</td></tr><tr><td class="l">Peso medido</td><td>${fmt(peso,1)}</td><td class="note">${ok(peso)?`dif. ${sgn((tot-peso)/peso*100,1)}%`:''}</td></tr></tbody></table></div></div></section>`;
}

/* ================= Nutrición: evolución de IMO y pliegues ================= */
function nutHist(){
 const P1=one('player');const rows=fAntro();if(!rows.length)return'';
 let cats,imo,sm,tI,tS,sub,nI;
 if(P1){const as=rows.filter(a=>a.pid===P1).sort((a,b)=>a.date<b.date?-1:1);if(!as.length)return'';cats=as.map(a=>fDate(a.date));imo=as.map(a=>ok(a.imo)?a.imo:null);sm=as.map(a=>ok(a.sum)?a.sum:null);
  tI=as.map(a=>`<b>${esc(P1)} · ${fDate(a.date)}</b><br>IM/O ${fmt(a.imo,2)}<br>Masa muscular ${fmt(a.musc,1)} kg ÷ masa ósea ${fmt(a.osea,1)} kg`);tS=as.map(a=>`<b>${esc(P1)} · ${fDate(a.date)}</b><br>Σ pliegues ${fmt(a.sum,1)} mm${ok(a.zad)?` · z adiposo ${fmt(a.zad,2)}`:''}`);sub=`${esc(P1)}: cada evaluación, en orden cronológico.`}
 else{const by=groupBy(rows,a=>a.date.slice(0,7));const ms=[...by.keys()].sort();cats=ms.map(m=>m.slice(5)+'/'+m.slice(2,4));const mv=(m,k)=>{const v=by.get(m).map(a=>a[k]).filter(ok);return v.length?mean(v):null};imo=ms.map(m=>mv(m,'imo'));sm=ms.map(m=>mv(m,'sum'));nI=ms.map(m=>new Set(by.get(m).map(a=>a.pid)).size);
  tI=ms.map((m,i)=>`<b>${m}</b><br>IM/O medio ${fmt(imo[i],2)} · ${nI[i]} jugadores evaluados`);tS=ms.map((m,i)=>`<b>${m}</b><br>Σ pliegues medio ${fmt(sm[i],1)} mm · ${nI[i]} jugadores evaluados`);sub='Media mensual de los jugadores evaluados ese mes (cambian de un mes a otro). Elegí un jugador para ver sus evaluaciones fecha por fecha.'}
 const rot=cats.length>12;
 return `<div class="grid2"><section class="panel"><div class="ph"><div class="t"><h2>Evolución del IM/O</h2><span class="sub">Índice músculo/óseo tal como figura en la planilla (masa muscular ÷ masa ósea; cociente sin unidad). ${sub}</span></div></div><div class="chart">${vbar({cats,series:[{vals:imo,color:'var(--e1)',tips:tI}],vlab:(j,i,v)=>fmt(v,2),vrot:rot,tdec:1,rot:true,maxLab:30,h:220,aria:'Evolución del IM/O'})}</div></section>`+
  `<section class="panel"><div class="ph"><div class="t"><h2>Evolución de la sumatoria de pliegues</h2><span class="sub">Suma de pliegues en mm (la planilla registra solo el total, no cada pliegue ni el protocolo; se asume el mismo en todas las evaluaciones). ${sub}</span></div></div><div class="chart">${vbar({cats,series:[{vals:sm,color:'var(--e4)',tips:tS}],vlab:(j,i,v)=>fmt(v,1),vrot:rot,tdec:0,rot:true,maxLab:30,h:220,aria:'Evolución de pliegues'})}</div></section></div>`;
}

/* ================= ERU: mejor por grupo y evolución ================= */
function eruExtras(rows){
 const t=UI.eruType;let h='';const byG=groupBy(rows,r=>r.g);

 const cx=eruCtx();const ctxRows=ERUC.recs.filter(r=>r.type==='P'&&passMatch(MI[r.mid],{...F,player:[],pos:[],group:[],rival:[],match:[],result:[]})&&r.min>=+F.minMin);const byPl=groupBy(ctxRows,r=>r.pid);const sin100=[...byPl].filter(([,rs])=>Math.abs(Math.max(...rs.map(r=>r.pct))-100)>1e-9).map(([p])=>p);
 add('Cada jugador tiene un partido al 100% propio en el contexto elegido',sin100.length===0&&ctxRows.every(r=>r.pct<=100+1e-9),`${byPl.size} jugadores con partidos en ${cx.label}${sin100.length?'; sin 100%: '+sin100.map(esc).join(', '):'; todos con su mejor partido = 100%'}. Los entrenamientos se expresan respecto de estos máximos y pueden superar 100%.`);
 const byGr=groupBy(ctxRows,r=>r.g);add('Cada posición tiene un partido al 100% en el contexto elegido',[...byGr].every(([,rs])=>Math.abs(Math.max(...rs.map(r=>r.pctPos))-100)<1e-9),Object.keys(ERUG).filter(g=>cx.mxG[g]).map(g=>`${ERUG[g]}: ${fmt(cx.mxG[g].eru,1)} (${esc(cx.mxG[g].pid)})`).join(' · '));
 const sample=eruRows({type:'P',player:'all',pos:'all',group:'all'})[0];if(sample){const before=sample.eru,bp=sample.pct,bq=sample.pctPos;const f1=eruRows({type:'P',player:[sample.pid]});const s2=f1.find(r=>r.mid===sample.mid);const ref1=JSON.stringify(ERUC.rS);add('Filtrar jugadores no cambia referencias, índices ni porcentajes',!!s2&&s2.eru===before&&s2.pct===bp&&s2.pctPos===bq&&JSON.stringify(ERUC.rS)===ref1,`${esc(sample.pid)} ${fDate(sample.date)}: ${fmt(before,2)} UA y ${fmt(bp,1)}% sin filtro de jugador; ${s2?fmt(s2.eru,2)+' UA y '+fmt(s2.pct,1)+'%':'–'} con ese jugador filtrado`)}
 const avgChk=[];const ms=DB.matches.filter(m=>SEQ[m.id]);let okB=true,ok60=true;for(const m of ms){const s=SEQ[m.id];const ns=new Set(s.map(x=>x.n));if(ns.size!==s.length)okB=false;const t60=sum(s.filter(x=>x.dur>60).map(x=>x.dur));const tot=sum(s.map(x=>x.dur));if(!(t60<=tot))ok60=false;avgChk.push(tot)}
 add('Cada secuencia BiP cuenta una sola vez por partido',okB,`${DB.seq.length} secuencias en ${ms.length} partidos`);

const b64u8=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function openData(pw){
 if(!window.crypto||!crypto.subtle)throw new Error('Este navegador no permite descifrar los datos. Abrí el sitio con https.');
 const r=await fetch('data.enc',{cache:'no-store'});if(!r.ok)throw new Error('No se encontró el archivo de datos publicado.');const e=await r.json();
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u8(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 let pt;try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(e.iv)},key,b64u8(e.ct))}catch(_){throw new Error('Contraseña incorrecta.')}
 const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();return JSON.parse(txt);
}
